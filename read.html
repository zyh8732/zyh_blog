<h1 id="txt-title">加载中…</h1>

<pre id="txt-body" class="txt-body">加载中…</pre>

<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var file = params.get('f') || '';
    var titleEl = document.getElementById('txt-title');
    var bodyEl = document.getElementById('txt-body');

    if (!file) {
      titleEl.textContent = '没有指定文件';
      bodyEl.textContent = '用法：/read/?f=<文件路径>';
      return;
    }

    titleEl.textContent = file.split('/').pop().split('?')[0];

    fetch(file, { cache: 'no-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) { bodyEl.textContent = text; })
      .catch(function (err) { bodyEl.textContent = '读取失败：' + err.message; });
  })();
</script>
