---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time>{{ page.date | date: "%Y-%m-%d" }}</time>
    {%- assign cats = page.categories -%}
    {%- if cats and cats.size > 0 %}
    <span class="path">{{ cats | join: " / " }}</span>
    {%- endif %}
  </p>

  {{ content }}
</article>

<p class="back"><a href="{{ '/blog/' | relative_url }}">← 返回文章树</a></p>
