# ============================================================
#  Jekyll 配置 · 纯 GitHub Pages（无自定义域名）
#  仓库名：zyh_blog
#  访问地址：https://<你的用户名>.github.io/zyh_blog/
#  需要你改的只有三行：title / author / url
# ============================================================

title: My_blog
description: Hello world!
author: zyh
lang: zh-CN

# --- 最容易错的两行 -----------------------------------------
# 仓库是「项目站点」而不是 <用户名>.github.io，所以必须带子路径
baseurl: "/zyh_blog"
# 改成你的 GitHub 用户名；只影响 RSS / sitemap 里的绝对链接
url: "https://zyh8732.github.io"
# ------------------------------------------------------------

markdown: kramdown
highlighter: rouge
timezone: Asia/Shanghai

# 文章永久链接：/zyh_blog/2025/01/02/hello-world/
# 注意：不把 :categories 放进来，避免中文目录出现在 URL 里
permalink: /:year/:month/:day/:title/

# 只用 GitHub Pages 白名单内的插件
plugins:
  - jekyll-feed
  - jekyll-sitemap

# 不参与构建
exclude:
  - README.md
  - .gitignore

# 文章只需 front matter 里的 title / date，layout 自动套 post
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

kramdown:
  input: GFM
  syntax_highlighter: rouge
