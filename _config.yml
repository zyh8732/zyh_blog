# ============================================================
#  Jekyll 配置 · 纯 GitHub Pages（无自定义域名）
#  仓库名：zyh_blog
#  访问地址：https://<你的用户名>.github.io/zyh_blog/
# ============================================================

title: My blog
description: Hello world!
author: zyh
lang: zh-CN

# --- 最容易错的两行 -----------------------------------------
baseurl: "/zyh_blog"
url: "https://zyh8732.github.io"
# ------------------------------------------------------------

markdown: kramdown
highlighter: rouge
timezone: Asia/Shanghai

# 文章＝节点目录下的「名字.md」，不写 front matter（没有 title / date）
# jekyll-optional-front-matter 让没有 front matter 的 Markdown 也能被渲染
plugins:
  - jekyll-optional-front-matter
  - jekyll-sitemap

# 不参与构建
exclude:
  - README.md
  - .gitignore

# 所有页面默认套文章布局（index / blog / 404 / read 有自己的 layout，会覆盖这里）
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: post

kramdown:
  input: GFM
  syntax_highlighter: rouge
